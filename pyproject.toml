[tool.ruff]
line-length = 100
target-version = "py313"
src = ["custom_components", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C4", "RET", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # French docstrings legitimately use non-ASCII

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]

# mypy is enabled from milestone M2 onwards, when the pure core exists
# (`custom_components/thermal_model/core`). Until then there is nothing to type.
# [tool.mypy]
# python_version = "3.13"
# strict = true
# files = ["custom_components/thermal_model/core"]
