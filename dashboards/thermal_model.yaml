# Thermal Model — tableau de bord
#
# Deux vues : les courbes (nécessite apexcharts-card, HACS) et un repli qui
# n'utilise que des cartes natives de Home Assistant.
#
# Les entity_id ci-dessous supposent que l'entrée de configuration s'appelle
# « Home » (d'où le préfixe `home_`). Si vous l'avez nommée autrement, remplacez
# `home_` par le slug de votre appareil Thermal Model (visible dans
# Paramètres → Appareils et services → Thermal Model).
#
# Import : Paramètres → Tableaux de bord → Ajouter un tableau de bord → vide,
# puis Modifier → Éditeur de code brut → coller.
title: Thermal Model
views:
  # ------------------------------------------------------------------
  # Vue 1 — courbes : passé mesuré, prévisions passées, prévision à venir
  # ------------------------------------------------------------------
  - title: Prévisions
    path: previsions
    icon: mdi:home-thermometer
    cards:
      - type: custom:apexcharts-card
        header:
          show: true
          title: Température intérieure — mesuré vs prévu
          show_states: true
          colorize_states: true
        graph_span: 96h
        span:
          # Fenêtre centrée sur maintenant : 48 h d'historique + 48 h de prévision
          offset: +48h
        now:
          show: true
          label: maintenant
        yaxis:
          - min: ~
            max: ~
            decimals: 1
            apex_config:
              tickAmount: 6
        series:
          # 1. Ce qui s'est réellement passé (historique de l'enregistreur)
          - entity: sensor.home_indoor_temperature
            name: Mesuré
            type: line
            curve: smooth
            stroke_width: 3
            color: '#03a9f4'
            show:
              legend_value: false
            fill_raw: last
          # 2. La prévision courante
          - entity: sensor.home_forecast_free_float
            name: Prévu (sans chauffage)
            type: line
            curve: smooth
            stroke_width: 2
            color: '#ff9800'
            show:
              legend_value: false
            data_generator: |
              const a = entity.attributes;
              if (!a.times || !a.values) return [];
              return a.times.map((t, i) => [new Date(t).getTime(), a.values[i]]);
          # 3. Le scénario thermostat
          - entity: sensor.home_forecast_thermostat
            name: Prévu (thermostat)
            type: line
            curve: smooth
            stroke_width: 2
            color: '#4caf50'
            show:
              legend_value: false
            data_generator: |
              const a = entity.attributes;
              if (!a.times || !a.values) return [];
              return a.times.map((t, i) => [new Date(t).getTime(), a.values[i]]);
          # 4-6. Les prévisions émises il y a ~6 h, ~12 h, ~24 h
          #      Comparées au mesuré, elles disent si le modèle dérive.
          - entity: sensor.home_forecast_free_float
            name: Prévu il y a ~6 h
            type: line
            curve: straight
            stroke_width: 1
            color: '#ff9800'
            opacity: 0.5
            show:
              legend_value: false
            data_generator: |
              const a = (entity.attributes.archived_runs || [])[0];
              if (!a) return [];
              return a.times.map((t, i) => [new Date(t).getTime(), a.values[i]]);
          - entity: sensor.home_forecast_free_float
            name: Prévu il y a ~12 h
            type: line
            curve: straight
            stroke_width: 1
            color: '#ff5722'
            opacity: 0.45
            show:
              legend_value: false
            data_generator: |
              const a = (entity.attributes.archived_runs || [])[1];
              if (!a) return [];
              return a.times.map((t, i) => [new Date(t).getTime(), a.values[i]]);
          - entity: sensor.home_forecast_free_float
            name: Prévu il y a ~24 h
            type: line
            curve: straight
            stroke_width: 1
            color: '#e91e63'
            opacity: 0.4
            show:
              legend_value: false
            data_generator: |
              const a = (entity.attributes.archived_runs || [])[2];
              if (!a) return [];
              return a.times.map((t, i) => [new Date(t).getTime(), a.values[i]]);

      - type: custom:apexcharts-card
        header:
          show: true
          title: Extérieur — mesuré vs prévision météo
        graph_span: 96h
        span:
          offset: +48h
        yaxis:
          - decimals: 1
            apex_config:
              tickAmount: 5
        series:
          - entity: sensor.outdoor_temperature
            name: Mesuré
            type: line
            curve: smooth
            stroke_width: 3
            color: '#607d8b'
            show:
              legend_value: false
          - entity: sensor.home_forecast_free_float
            name: Prévision météo
            type: area
            curve: smooth
            stroke_width: 1
            color: '#90a4ae'
            opacity: 0.25
            show:
              legend_value: false
            data_generator: |
              const a = entity.attributes;
              if (!a.weather_times || !a.weather_outdoor) return [];
              return a.weather_times.map((t, i) => [new Date(t).getTime(), a.weather_outdoor[i]]);

      - type: markdown
        title: État du modèle
        content: |
          {% set s = 'sensor.home_forecast_free_float' %}
          - **Émis** : {{ state_attr(s, 'issued_at') or '—' }}
          {% if state_attr(s, 'stale') %}- ⚠️ **Données météo indisponibles** : les dernières trajectoires connues sont affichées ({{ state_attr(s, 'error') }})
          {% endif %}
          - **Minimum prévu** : {{ state_attr(s, 'minimum') }} °C à {{ state_attr(s, 'minimum_at') }}
          - **Fenêtre** : {{ state_attr(s, 'horizon_hours') }} h · modèle météo `{{ state_attr(s, 'weather_model') }}`
          - **Paramètres** ({{ state_attr(s, 'params_source') }}) : `{{ state_attr(s, 'params_digest') }}`
          - **Prévisions archivées** : {{ state_attr(s, 'archived_runs') | count }} exécution(s) disponible(s) pour comparaison

      - type: entities
        title: Modèle 1R1C
        entities:
          - entity: number.home_wall_loss_a
            name: Déperditions (a)
          - entity: number.home_solar_gain_c_s
            name: Apport solaire (c_s)
          - entity: number.home_internal_gain_d
            name: Apports internes (d)
          - entity: number.home_heating_gain_k
            name: Gain de chauffe (k)
          - entity: number.home_scenario_setpoint
            name: Consigne du scénario
          - entity: number.home_heating_capacity
            name: Puissance de chauffe
          - entity: number.home_forecast_horizon
            name: Horizon de prévision

  # ------------------------------------------------------------------
  # Vue 2 — repli sans carte personnalisée (cartes natives uniquement)
  # ------------------------------------------------------------------
  - title: Repli natif
    path: repli
    icon: mdi:chart-line
    cards:
      - type: history-graph
        title: Température intérieure et extérieure (48 h)
        hours_to_show: 48
        entities:
          - entity: sensor.home_indoor_temperature
            name: Intérieur
          - entity: sensor.outdoor_temperature
            name: Extérieur
      - type: entities
        title: Prévisions à l'heure prochaine
        entities:
          - entity: sensor.home_forecast_free_float
            name: Sans chauffage
          - entity: sensor.home_forecast_thermostat
            name: Thermostat
          - entity: sensor.home_indoor_temperature
            name: Mesuré maintenant
      - type: markdown
        title: À propos
        content: |
          Cette vue n'utilise que des cartes natives. Les trajectoires complètes
          (et les prévisions passées) sont dans les attributs des capteurs
          « Forecast … » : ouvrez un capteur → Attributs, ou consultez la vue
          « Prévisions » qui nécessite [apexcharts-card](https://github.com/RomRider/apexcharts-card).
